name: yuheng-demo verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout core governance source
        uses: actions/checkout@v4
        with:
          repository: huhua1990/yuheng-core
          ref: main
          path: yuheng-core

      - name: Verify consumer project
        run: |
          python3 sync/skills/sync-specs/scripts/postcheck_project.py \
            --project-root . --project-id yuheng-demo --json
          python3 sync/skills/sync-specs/scripts/sync-specs-api.py \
            --source yuheng-core --target . --verify --json

  verify-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout core UI source
        uses: actions/checkout@v4
        with:
          repository: huhua1990/yuheng-core
          ref: main
          path: yuheng-core

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Check consumer platform boundary
        working-directory: yuheng-demo-ui
        run: node scripts/check-platform-imports.mjs

      - name: Install core UI build dependencies
        working-directory: yuheng-core/yuheng-ui
        run: pnpm install --frozen-lockfile

      - name: Build local core artifact and verify consumer
        working-directory: yuheng-demo-ui
        env:
          YUHENG_CORE_ROOT: ${{ github.workspace }}/yuheng-core
        # The verifier validates file:vendor metadata and packed name/version,
        # builds/copies the artifact, refreshes its content-addressed lock entry,
        # then performs a frozen consumer install and all consumer checks.
        run: node scripts/verify-local-package.mjs --ci
